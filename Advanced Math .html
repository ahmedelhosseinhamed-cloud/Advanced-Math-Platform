<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📐 Advanced Math — Question Bank</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ① KaTeX — High-performance math rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<!-- KaTeX Auto-render extension: automatically finds and renders math delimiters -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
  onload="window._katexReady = true; if(window._katexReadyCb) window._katexReadyCb();"></script>

<style>
/* ══════════════════════════════════════════════════════
   DESIGN TOKENS — Deep Purple Theme
   ══════════════════════════════════════════════════════ */
:root {
  --purple-deep:    #0f0c29;
  --purple-mid:     #302b63;
  --purple-dark:    #24243e;
  --purple-accent:  #7c3aed;
  --purple-light:   #a78bfa;
  --purple-lighter: #c4b5fd;
  --purple-faint:   #ede9fe;
  --purple-card:    rgba(30,10,74,0.9);
  --green:          #22c55e;
  --green-light:    #86efac;
  --red:            #f43f5e;
  --blue:           #4f8ef7;
  --amber:          #f59e0b;
  --violet:         #a855f7;
  --text:           #e8e0f0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, var(--purple-deep) 0%, var(--purple-mid) 50%, var(--purple-dark) 100%);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
}

/* ── GLOBAL PROGRESS BAR (top of page, tracks quiz history) ── */
#globalProgressWrap {
  position: sticky;
  top: 0;
  z-index: 500;
  height: 5px;
  background: rgba(255,255,255,0.07);
  overflow: hidden;
}
#globalProgressFill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple-accent), var(--purple-light), var(--green));
  transition: width 0.6s ease;
  width: 0%;
}

/* ── HEADER ── */
.header {
  background: linear-gradient(90deg, #1a0533 0%, #2d1b69 50%, #1a0533 100%);
  border-bottom: 2px solid var(--purple-accent);
  padding: 28px 32px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.header-sub  { font-size: 11px; letter-spacing: 4px; color: var(--purple-light); text-transform: uppercase; margin-bottom: 6px; }
.header h1   { font-family: 'Playfair Display', serif; font-size: clamp(22px,4vw,36px); font-weight: 900; color: #fff; letter-spacing: -1px; }
.header-desc { font-size: 13px; color: var(--purple-lighter); margin-top: 4px; }
.pills       { display: flex; gap: 10px; flex-wrap: wrap; }
.pill        { border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; }

/* ── STATS ROW (best score display) ── */
.stats-row {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 32px;
  background: rgba(15,12,41,0.6);
  border-bottom: 1px solid rgba(124,58,237,0.2);
  font-size: 13px;
  color: var(--purple-light);
}
.stat-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(124,58,237,0.15);
  border: 1px solid rgba(124,58,237,0.3);
  border-radius: 8px;
  padding: 4px 12px;
  font-weight: 600;
}
.stat-badge .stat-icon { font-size: 15px; }
.stat-badge .stat-val  { color: var(--purple-lighter); }
.stat-badge.gold       { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.1); }
.stat-badge.gold .stat-val { color: var(--amber); }

/* ── FILTERS ── */
.filters {
  padding: 20px 24px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.search-box {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(124,58,237,0.4);
  border-radius: 10px;
  padding: 9px 16px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  min-width: 220px;
  flex: 1;
  font-family: 'DM Sans', sans-serif;
  transition: border-color 0.2s;
}
.search-box:focus       { border-color: var(--purple-accent); }
.search-box::placeholder { color: rgba(167,139,250,0.6); }

select {
  background: #1e0a4a;
  border: 1px solid rgba(124,58,237,0.4);
  border-radius: 10px;
  padding: 9px 14px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
select:focus { border-color: var(--purple-accent); }

.btn-quiz {
  background: linear-gradient(135deg,#7c3aed,#a855f7);
  border: none;
  border-radius: 10px;
  padding: 9px 20px;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(124,58,237,0.4);
  font-family: 'DM Sans', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-quiz:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.5); }

/* ④ Print button */
.btn-print {
  background: linear-gradient(135deg, #0f766e, #0d9488);
  border: none;
  border-radius: 10px;
  padding: 9px 20px;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(20,184,166,0.35);
  font-family: 'DM Sans', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-print:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(20,184,166,0.5); }

.count-label { font-size: 13px; color: var(--purple-light); margin-left: auto; }

/* ── GRID ── */
.grid {
  padding: 8px 24px 40px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px,1fr));
  gap: 16px;
}

/* ── CARD ── */
.card {
  background: linear-gradient(135deg, rgba(30,10,74,0.9), rgba(45,27,105,0.7));
  border-radius: 14px;
  padding: 18px 20px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  position: relative; /* needed for hint positioning */
}
.card:hover { transform: translateY(-2px); }

.card-top    { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.card-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge       { border-radius: 6px; padding: 2px 9px; font-size: 11px; font-weight: 700; }
.badge-level { background: rgba(255,255,255,0.07); color: var(--purple-light); }
.card-id     { font-size: 11px; color: #6b5fa6; }
.card-topic  { font-size: 13px; color: var(--purple-lighter); margin-bottom: 10px; }
.card-question { font-size: clamp(13px,2vw,15px); color: var(--purple-faint); line-height: 1.65; font-weight: 500; }

.options-list { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.option-item  { font-size: 12px; color: #9a8fc0; padding: 2px 0; }
.option-letter { color: var(--purple-accent); margin-right: 6px; }

.btn-reveal {
  margin-top: 14px;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.btn-reveal.hidden { background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.33); color: var(--purple-lighter); }
.btn-reveal.shown  { background: rgba(34,197,94,0.15);  border: 1px solid rgba(34,197,94,0.33);  color: var(--green-light); }

.answer-box {
  margin-top: 10px;
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.25);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--green-light);
  font-size: 13px;
  line-height: 1.7;
}

/* ── EMPTY STATE ── */
.empty      { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #6b5fa6; }
.empty-icon { font-size: 48px; }
.empty-text { font-size: 18px; margin-top: 12px; }

/* ══════════════════════════════════════════════════════
   ② HINT SYSTEM
   ══════════════════════════════════════════════════════ */
.hint-btn {
  background: rgba(245,158,11,0.12);
  border: 1px solid rgba(245,158,11,0.35);
  color: var(--amber);
  border-radius: 7px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.hint-btn:hover {
  background: rgba(245,158,11,0.22);
  transform: translateY(-1px);
}
.hint-card {
  margin-top: 10px;
  background: linear-gradient(135deg, rgba(245,158,11,0.10), rgba(245,158,11,0.05));
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: 9px;
  padding: 10px 14px;
  color: #fcd34d;
  font-size: 12.5px;
  line-height: 1.65;
  animation: fadeSlideIn 0.25s ease;
}
.hint-card-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--amber);
  text-transform: uppercase;
  margin-bottom: 5px;
  display: block;
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════════════════
   QUIZ MODAL
   ══════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,5,25,0.93);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-box {
  background: linear-gradient(135deg, #1e0a4a, #2d1b69);
  border: 2px solid var(--purple-accent);
  border-radius: 20px;
  padding: 32px 28px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 0 60px rgba(124,58,237,0.4);
  max-height: 90vh;
  overflow-y: auto;
}

.quiz-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--purple-light);
  align-items: center;
  gap: 8px;
}
.btn-exit { background: transparent; border: none; color: var(--red); cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; }

/* ③ TIMER display */
.quiz-timer {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(244,63,94,0.12);
  border: 1px solid rgba(244,63,94,0.3);
  border-radius: 8px;
  padding: 3px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--red);
  transition: background 0.3s, border-color 0.3s;
  min-width: 68px;
  justify-content: center;
}
.quiz-timer.warn {
  background: rgba(244,63,94,0.25);
  border-color: rgba(244,63,94,0.6);
  animation: pulse 0.7s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.65; }
}

/* Quiz progress bar (inside modal) */
.progress-bar-wrap { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 18px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--purple-accent), var(--purple-light)); border-radius: 3px; transition: width 0.4s; }

.quiz-tag { border-radius: 10px; padding: 6px 12px; margin-bottom: 16px; font-size: 12px; display: inline-block; }
.quiz-question { font-size: clamp(15px,3vw,18px); font-weight: 600; color: #fff; margin-bottom: 20px; line-height: 1.6; }

.mcq-options { display: flex; flex-direction: column; gap: 10px; }
.mcq-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; padding: 12px 16px;
  color: var(--text); cursor: pointer;
  text-align: left; font-size: 14px;
  transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
  width: 100%;
}
.mcq-btn:not([disabled]):hover { background: rgba(124,58,237,0.2); border-color: var(--purple-accent); }
.mcq-btn.correct   { background: rgba(34,197,94,0.2)!important;  border: 1px solid var(--green)!important; }
.mcq-btn.incorrect { background: rgba(244,63,94,0.2)!important;  border: 1px solid var(--red)!important; }
.mcq-btn.selected  { background: rgba(124,58,237,0.3);            border: 1px solid var(--purple-accent); }

.tf-options { display: flex; gap: 12px; }
.tf-btn {
  flex: 1;
  border-radius: 10px; padding: 14px;
  color: var(--text); cursor: pointer; font-size: 15px; font-weight: 700;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.tf-btn:not([disabled]):hover { background: rgba(124,58,237,0.2); border-color: var(--purple-accent); }
.tf-btn.correct   { background: rgba(34,197,94,0.2)!important;  border-color: var(--green)!important; }
.tf-btn.incorrect { background: rgba(244,63,94,0.2)!important;  border-color: var(--red)!important; }

.btn-primary {
  display: block; width: 100%;
  border: none; border-radius: 10px; padding: 12px;
  color: #fff; cursor: pointer; font-size: 15px; font-weight: 700;
  margin-top: 12px; font-family: 'DM Sans', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-primary:hover  { transform: translateY(-1px); }
.btn-next           { background: linear-gradient(135deg, var(--blue), #3b7fe8);         box-shadow: 0 4px 15px rgba(79,142,247,0.44); }
.btn-reveal-quiz    { background: linear-gradient(135deg, var(--purple-accent), #9333ea); box-shadow: 0 4px 15px rgba(124,58,237,0.44); }
.btn-back           { background: linear-gradient(135deg, var(--purple-accent), #9333ea); box-shadow: 0 4px 15px rgba(124,58,237,0.44); margin-top: 16px; }
.btn-retry          { background: linear-gradient(135deg, var(--green), #16a34a);         box-shadow: 0 4px 15px rgba(34,197,94,0.35); margin-top: 10px; }

.quiz-answer-box {
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.27);
  border-radius: 10px; padding: 14px 16px;
  color: var(--green-light); font-size: 14px; line-height: 1.7;
  margin-top: 12px;
}

/* ── QUIZ HINT (inside modal) ── */
.quiz-hint-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.3);
  color: var(--amber);
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  width: 100%;
  justify-content: center;
}
.quiz-hint-btn:hover { background: rgba(245,158,11,0.2); }
.quiz-hint-box {
  margin-top: 10px;
  background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(245,158,11,0.06));
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: 9px;
  padding: 12px 16px;
  color: #fcd34d;
  font-size: 13.5px;
  line-height: 1.65;
  animation: fadeSlideIn 0.25s ease;
}

/* ── FINISH SCREEN ── */
.finish        { text-align: center; }
.finish-icon   { font-size: 64px; }
.finish h2     { color: var(--purple-light); margin: 12px 0 8px; font-family: 'Playfair Display', serif; }
.finish-score  { font-size: 42px; font-weight: 900; color: #fff; }
.finish-pct    { color: var(--purple-lighter); margin-top: 8px; }
.finish-best   { margin-top: 14px; font-size: 14px; color: var(--amber); font-weight: 600; }
.finish-detail {
  margin-top: 16px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  padding: 14px;
  font-size: 13px;
  color: var(--purple-light);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  text-align: left;
}
.finish-detail span { color: var(--purple-lighter); font-weight: 600; }

/* ══════════════════════════════════════════════════════
   ⑤ PRINT / PDF STYLES
   ══════════════════════════════════════════════════════ */
@media print {
  /* Hide all dark-theme UI */
  #globalProgressWrap, .stats-row, .filters, #quizModal,
  .btn-reveal, .btn-print, .btn-quiz,
  .hint-btn, .hint-card,
  .header { display: none !important; }

  body {
    background: #fff !important;
    color: #111 !important;
    font-family: 'DM Sans', Georgia, serif;
  }

  .print-header {
    display: block !important;
    text-align: center;
    border-bottom: 2px solid #7c3aed;
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  .print-header h1  { font-size: 22px; color: #1a0533; font-family: 'Playfair Display', serif; }
  .print-header p   { font-size: 12px; color: #666; margin-top: 4px; }

  .grid {
    display: block !important;
    padding: 0 !important;
  }

  .card {
    background: #fff !important;
    border: 1px solid #d1c4e9 !important;
    border-radius: 6px !important;
    padding: 14px 16px !important;
    margin-bottom: 12px !important;
    box-shadow: none !important;
    transform: none !important;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .card-topic    { color: #5b21b6 !important; font-size: 11px !important; }
  .card-question { color: #1a0533 !important; font-size: 13px !important; }
  .card-id       { color: #999 !important; }
  .badge         { border: 1px solid #ccc !important; color: #555 !important; background: #f3f3f3 !important; }
  .badge-level   { color: #5b21b6 !important; }
  .option-item   { color: #333 !important; }
  .option-letter { color: #7c3aed !important; }
  .answer-box    { display: none !important; } /* Hide answers on print sheet */

  /* KaTeX math looks fine on white background — no overrides needed */
}

/* Print header is hidden on screen */
.print-header { display: none; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .header  { padding: 18px 16px 14px; }
  .filters { padding: 14px 16px 8px; }
  .grid    { padding: 8px 12px 40px; }
  .modal-box { padding: 22px 16px; }
  .stats-row { padding: 8px 16px; }
}
</style>
</head>
<body>

<!-- ③ Global Progress Bar (tracks best score visually) -->
<div id="globalProgressWrap">
  <div id="globalProgressFill"></div>
</div>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-sub">Applied Technology Schools</div>
    <h1>📐 Advanced Math</h1>
    <div class="header-desc" id="headerDesc"></div>
  </div>
  <div class="pills" id="headerPills"></div>
</div>

<!-- ③ STATS ROW — Highest Score & Quiz Count from localStorage -->
<div class="stats-row">
  <div class="stat-badge gold" id="statBestScore">
    <span class="stat-icon">🏆</span>
    Best Score: <span class="stat-val" id="bestScoreVal">—</span>
  </div>
  <div class="stat-badge" id="statQuizCount">
    <span class="stat-icon">📋</span>
    Quizzes Taken: <span class="stat-val" id="quizCountVal">0</span>
  </div>
  <div class="stat-badge" id="statAvgScore">
    <span class="stat-icon">📈</span>
    Avg Score: <span class="stat-val" id="avgScoreVal">—</span>
  </div>
  <button id="resetStatsBtn" style="margin-left:auto;background:transparent;border:1px solid rgba(244,63,94,0.3);color:var(--red);border-radius:7px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;">
    Reset Stats
  </button>
</div>

<!-- FILTERS -->
<div class="filters">
  <input class="search-box" id="searchInput" placeholder="🔍 Search questions..." />
  <select id="topicFilter"></select>
  <select id="typeFilter"></select>
  <select id="levelFilter"></select>
  <button class="btn-quiz" id="quizBtn">▶ Quiz Mode (<span id="filteredCount">0</span>)</button>
  <!-- ⑤ Print button -->
  <button class="btn-print" id="printBtn" title="Export filtered questions as a printable PDF">🖨 Print Sheet</button>
  <div class="count-label" id="countLabel"></div>
</div>

<!-- ⑤ Print-only header (hidden on screen) -->
<div class="print-header">
  <h1>📐 Advanced Math — Practice Sheet</h1>
  <p id="printSubtitle"></p>
</div>

<!-- QUESTION CARDS -->
<div class="grid" id="grid"></div>

<!-- QUIZ MODAL -->
<div class="modal-overlay" id="quizModal" style="display:none;">
  <div class="modal-box" id="quizBox"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════════
   DATA — questionBank (169 questions)
   Each question may have an optional `hint` field.

/* ══════════════════════════════════════════════════════════════════════════════
   CONFIG — Labels, colors, timer settings
   ══════════════════════════════════════════════════════════════════════════════ */
const TOPICS  = ["All Topics",  ...Array.from(new Set(questionBank.map(q => q.topic)))];
const TYPES   = ["All Types",   "complete", "mcq", "tf", "essay", "match"];
const LEVELS  = ["All Levels",  "L1","L2","L3","L4","L5","L6","L7","L8"];

const TYPE_LABELS = { complete:"Fill in Blank", mcq:"Multiple Choice", tf:"True / False", essay:"Problem Solving", match:"Match" };
const TYPE_COLORS = { complete:"#4f8ef7", mcq:"#a855f7", tf:"#22c55e", essay:"#f59e0b", match:"#f43f5e" };
const PILL_COLORS = { complete:"#4f8ef7", mcq:"#a855f7", tf:"#22c55e", essay:"#f59e0b", match:"#f43f5e" };

// ③ Timer configuration: total seconds for the whole quiz
const QUIZ_TOTAL_SECONDS = 60; // seconds per question (total = questions × this)

/* ══════════════════════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════════════════════ */
let filter = { topic:"All Topics", type:"All Types", level:"All Levels", search:"" };
let revealed  = {};   // { id: true/false }
let hintShown = {};   // { id: true/false } — card hint toggle state

// Quiz state
let quizState = {
  active:false, idx:0, score:0,
  answered:false, chosen:null, finished:false,
  questions:[], hintShownInQuiz:false,
  timeLeft:0, timerInterval:null,
  startTime:null, totalSeconds:0
};

/* ══════════════════════════════════════════════════════════════════════════════
   ③ LOCALSTORAGE — Progress tracking helpers
   ══════════════════════════════════════════════════════════════════════════════ */
const LS_KEY = 'mathQB_stats';

/** Load stats object from localStorage (or return defaults) */
function loadStats() {
  try {
    return JSON.parse(localStorage.getItem(LS_KEY)) || { bestScore:null, bestPct:null, quizCount:0, totalCorrect:0, totalAnswered:0 };
  } catch { return { bestScore:null, bestPct:null, quizCount:0, totalCorrect:0, totalAnswered:0 }; }
}

/** Save stats object to localStorage */
function saveStats(stats) {
  localStorage.setItem(LS_KEY, JSON.stringify(stats));
}

/** Update stats after a quiz is completed */
function recordQuizResult(score, total) {
  const stats = loadStats();
  const pct   = total > 0 ? Math.round((score / total) * 100) : 0;

  stats.quizCount++;
  stats.totalCorrect  += score;
  stats.totalAnswered += total;

  // Update best score
  if (stats.bestPct === null || pct > stats.bestPct) {
    stats.bestScore = score;
    stats.bestPct   = pct;
    stats.bestTotal = total;
  }

  saveStats(stats);
  renderStatsRow();
  updateGlobalProgressBar(stats);
}

/** Render the stats row in the header */
function renderStatsRow() {
  const stats = loadStats();

  const bestVal  = document.getElementById('bestScoreVal');
  const countVal = document.getElementById('quizCountVal');
  const avgVal   = document.getElementById('avgScoreVal');

  if (stats.bestPct !== null) {
    bestVal.textContent  = `${stats.bestScore}/${stats.bestTotal} (${stats.bestPct}%)`;
  } else {
    bestVal.textContent  = '—';
  }

  countVal.textContent = stats.quizCount;

  if (stats.quizCount > 0 && stats.totalAnswered > 0) {
    const avg = Math.round((stats.totalCorrect / stats.totalAnswered) * 100);
    avgVal.textContent = `${avg}%`;
  } else {
    avgVal.textContent = '—';
  }

  updateGlobalProgressBar(stats);
}

/** Update the thin top progress bar based on best score percentage */
function updateGlobalProgressBar(stats) {
  const fill = document.getElementById('globalProgressFill');
  fill.style.width = (stats.bestPct !== null ? stats.bestPct : 0) + '%';
}

/* ══════════════════════════════════════════════════════════════════════════════
   ① KaTeX — Auto-render math in a specific container
   ══════════════════════════════════════════════════════════════════════════════ */
/**
 * Renders all LaTeX math notation inside `el`.
 * Called after injecting new HTML to ensure math is typeset.
 * Supports: $...$ for inline, $$...$$ for display math.
 */
function renderMath(el) {
  if (!el) return;
  if (window._katexReady && window.renderMathInElement) {
    window.renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true  },
        { left: '$',  right: '$',  display: false },
      ],
      throwOnError: false,
      output: 'html'
    });
  } else {
    // KaTeX not yet loaded — queue a retry
    window._katexReadyCb = () => renderMath(el);
  }
}

/* ══════════════════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════════════════ */
function getFiltered() {
  return questionBank.filter(q => {
    if (filter.topic  !== "All Topics"  && q.topic  !== filter.topic)  return false;
    if (filter.type   !== "All Types"   && q.type   !== filter.type)   return false;
    if (filter.level  !== "All Levels"  && q.level  !== filter.level)  return false;
    if (filter.search && !q.question.toLowerCase().includes(filter.search.toLowerCase())) return false;
    return true;
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   INIT SELECTS
   ══════════════════════════════════════════════════════════════════════════════ */
function initSelects() {
  const topicSel = document.getElementById('topicFilter');
  const typeSel  = document.getElementById('typeFilter');
  const levelSel = document.getElementById('levelFilter');

  TOPICS.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t;                 topicSel.appendChild(o); });
  TYPES.forEach(t  => { const o = document.createElement('option'); o.value = t; o.textContent = TYPE_LABELS[t]||t; typeSel.appendChild(o); });
  LEVELS.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t;                 levelSel.appendChild(o); });

  topicSel.addEventListener('change', e => { filter.topic  = e.target.value; renderGrid(); });
  typeSel.addEventListener('change',  e => { filter.type   = e.target.value; renderGrid(); });
  levelSel.addEventListener('change', e => { filter.level  = e.target.value; renderGrid(); });
  document.getElementById('searchInput').addEventListener('input', e => { filter.search = e.target.value; renderGrid(); });
  document.getElementById('quizBtn').addEventListener('click', startQuiz);

  // ⑤ Print button
  document.getElementById('printBtn').addEventListener('click', () => {
    // Update print subtitle with current filter info
    const filtered = getFiltered();
    document.getElementById('printSubtitle').textContent =
      `${filtered.length} Questions · Topic: ${filter.topic} · Type: ${filter.type} · Level: ${filter.level} · Generated ${new Date().toLocaleDateString()}`;
    window.print();
  });

  // Reset stats button
  document.getElementById('resetStatsBtn').addEventListener('click', () => {
    if (confirm('Reset all quiz statistics? This cannot be undone.')) {
      localStorage.removeItem(LS_KEY);
      renderStatsRow();
    }
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   INIT HEADER
   ══════════════════════════════════════════════════════════════════════════════ */
function initHeader() {
  document.getElementById('headerDesc').textContent =
    `Question Bank — ${questionBank.length} Questions · Grades 1 Secondary`;

  const pills = document.getElementById('headerPills');
  ['complete','mcq','tf','essay','match'].forEach(t => {
    const count = questionBank.filter(q => q.type === t).length;
    const span  = document.createElement('span');
    span.className = 'pill';
    span.textContent = `${count} ${TYPE_LABELS[t]}`;
    span.style.cssText = `background:${PILL_COLORS[t]}22;border:1px solid ${PILL_COLORS[t]}55;color:${PILL_COLORS[t]}`;
    pills.appendChild(span);
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   RENDER GRID
   ══════════════════════════════════════════════════════════════════════════════ */
function renderGrid() {
  const filtered = getFiltered();
  const grid     = document.getElementById('grid');
  document.getElementById('filteredCount').textContent = filtered.length;
  document.getElementById('countLabel').textContent    = `${filtered.length} of ${questionBank.length} questions`;

  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No questions match your filters.</div></div>`;
    return;
  }

  filtered.forEach(q => {
    const color      = TYPE_COLORS[q.type];
    const isRevealed = !!revealed[q.id];
    const isHintOn   = !!hintShown[q.id];

    const card = document.createElement('div');
    card.className = 'card';
    card.style.border = `1px solid ${color}44`;

    // Options HTML (MCQ)
    let optionsHTML = '';
    if (q.type === 'mcq' && q.options) {
      optionsHTML = `<div class="options-list">
        ${q.options.map((opt, i) => `<div class="option-item"><span class="option-letter">${String.fromCharCode(65+i)}.</span>${opt}</div>`).join('')}
      </div>`;
    }

    // Answer HTML
    const answerHTML = isRevealed ? `<div class="answer-box">✅ ${q.answer}</div>` : '';

    // ② Hint button + card HTML
    const hintHTML = q.hint ? `
      <button class="hint-btn" data-id="${q.id}">
        💡 ${isHintOn ? 'Hide Hint' : 'Need a Hint?'}
      </button>
      ${isHintOn ? `<div class="hint-card"><span class="hint-card-label">💡 Hint</span>${q.hint}</div>` : ''}
    ` : '';

    card.innerHTML = `
      <div class="card-top">
        <div class="card-badges">
          <span class="badge" style="background:${color}33;color:${color};border:1px solid ${color}55">${TYPE_LABELS[q.type]}</span>
          <span class="badge badge-level">${q.level}</span>
        </div>
        <span class="card-id">#${q.id}</span>
      </div>
      <div class="card-topic">${q.topic}</div>
      <div class="card-question">${q.question}</div>
      ${optionsHTML}
      ${hintHTML}
      <button class="btn-reveal ${isRevealed ? 'shown' : 'hidden'}" data-id="${q.id}">
        ${isRevealed ? '▲ Hide Answer' : '▼ Show Answer'}
      </button>
      ${answerHTML}
    `;

    // Reveal answer button
    card.querySelector('.btn-reveal').addEventListener('click', e => {
      e.stopPropagation();
      revealed[q.id] = !revealed[q.id];
      renderGrid();
    });

    // ② Hint button toggle
    const hintBtn = card.querySelector('.hint-btn');
    if (hintBtn) {
      hintBtn.addEventListener('click', e => {
        e.stopPropagation();
        hintShown[q.id] = !hintShown[q.id];
        renderGrid();
      });
    }

    grid.appendChild(card);
  });

  // ① Render KaTeX math in the entire grid after DOM update
  renderMath(grid);
}

/* ══════════════════════════════════════════════════════════════════════════════
   ③ QUIZ TIMER
   ══════════════════════════════════════════════════════════════════════════════ */
/** Start the countdown timer for the current quiz */
function startTimer() {
  clearInterval(quizState.timerInterval);
  const timerEl = document.getElementById('quizTimerDisplay');
  if (!timerEl) return;

  quizState.timerInterval = setInterval(() => {
    quizState.timeLeft--;
    updateTimerDisplay();

    if (quizState.timeLeft <= 0) {
      clearInterval(quizState.timerInterval);
      // Time's up — auto-finish the quiz
      quizState.finished = true;
      renderQuiz();
    }
  }, 1000);
}

/** Update the timer element's text and warn styling */
function updateTimerDisplay() {
  const timerEl = document.getElementById('quizTimerDisplay');
  if (!timerEl) return;

  const m = Math.floor(quizState.timeLeft / 60);
  const s = quizState.timeLeft % 60;
  timerEl.textContent = `⏱ ${m}:${s.toString().padStart(2,'0')}`;

  // Warning pulse when < 30 seconds remain
  if (quizState.timeLeft <= 30) timerEl.classList.add('warn');
  else timerEl.classList.remove('warn');
}

/** Stop and clear the timer interval */
function stopTimer() {
  clearInterval(quizState.timerInterval);
  quizState.timerInterval = null;
}

/* ══════════════════════════════════════════════════════════════════════════════
   QUIZ — Start
   ══════════════════════════════════════════════════════════════════════════════ */
function startQuiz() {
  const filtered = getFiltered();
  if (filtered.length === 0) return;

  // Calculate total time based on question count
  const totalSecs = filtered.length * QUIZ_TOTAL_SECONDS;

  quizState = {
    active:true, idx:0, score:0,
    answered:false, chosen:null, finished:false,
    questions:[...filtered],
    hintShownInQuiz:false,
    timeLeft:totalSecs,
    totalSeconds:totalSecs,
    startTime:Date.now(),
    timerInterval:null
  };

  renderQuiz();
}

/* ══════════════════════════════════════════════════════════════════════════════
   QUIZ — Render Main Frame
   ══════════════════════════════════════════════════════════════════════════════ */
function renderQuiz() {
  const modal = document.getElementById('quizModal');
  const box   = document.getElementById('quizBox');
  modal.style.display = 'flex';

  // ── FINISH SCREEN ──
  if (quizState.finished) {
    stopTimer();

    const total = quizState.questions.length;
    const pct   = Math.round((quizState.score / total) * 100);
    const timeTaken = Math.round((Date.now() - quizState.startTime) / 1000);
    const msg   = quizState.score >= total*0.8 ? 'Excellent! 🌟' :
                  quizState.score >= total*0.6 ? 'Good Work! 👍' : 'Keep Practicing 📚';

    // ③ Save to localStorage
    recordQuizResult(quizState.score, total);

    box.innerHTML = `
      <div class="finish">
        <div class="finish-icon">🎓</div>
        <h2>Quiz Complete!</h2>
        <div class="finish-score">${quizState.score} / ${total}</div>
        <div class="finish-pct">${pct}% — ${msg}</div>
        <div class="finish-detail">
          <div>✅ Correct: <span>${quizState.score}</span></div>
          <div>❌ Wrong: <span>${total - quizState.score}</span></div>
          <div>⏱ Time: <span>${Math.floor(timeTaken/60)}m ${timeTaken%60}s</span></div>
          <div>📊 Score: <span>${pct}%</span></div>
        </div>
        <button class="btn-primary btn-retry" id="btnRetry">🔄 Try Again</button>
        <button class="btn-primary btn-back"  id="btnBack">← Back to Question Bank</button>
      </div>`;

    document.getElementById('btnRetry').addEventListener('click', startQuiz);
    document.getElementById('btnBack').addEventListener('click',  () => { modal.style.display = 'none'; });
    return;
  }

  // ── QUESTION SCREEN ──
  const q     = quizState.questions[quizState.idx];
  const total = quizState.questions.length;
  const color = TYPE_COLORS[q.type];
  const pctW  = Math.round((quizState.idx / total) * 100);

  box.innerHTML = `
    <div class="quiz-header">
      <span>Q ${quizState.idx + 1} / ${total} &nbsp;|&nbsp; Score: ${quizState.score}</span>
      <div class="quiz-timer" id="quizTimerDisplay">⏱ --:--</div>
      <button class="btn-exit" id="btnExit">✕ Exit</button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${pctW}%"></div>
    </div>
    <div class="quiz-tag" style="background:${color}22;border:1px solid ${color}55;color:${color}">
      ${TYPE_LABELS[q.type]} · ${q.level} · ${q.topic}
    </div>
    <div class="quiz-question" id="quizQuestionText">${q.question}</div>
    <div id="quizInteractive"></div>
    <div id="quizHintArea"></div>
    <div id="quizAnswerBox"></div>
    <div id="quizNext"></div>
  `;

  // Wire exit button
  document.getElementById('btnExit').addEventListener('click', () => {
    stopTimer();
    modal.style.display = 'none';
  });

  // ① Render math in question text
  renderMath(document.getElementById('quizQuestionText'));

  // Render interactive part (MCQ / T-F / reveal)
  renderQuizInteractive(q);

  // ③ Start/resume timer display (don't restart interval if already running)
  updateTimerDisplay();
  if (!quizState.timerInterval) startTimer();
}

/* ══════════════════════════════════════════════════════════════════════════════
   QUIZ — Interactive Question Area
   ══════════════════════════════════════════════════════════════════════════════ */
function renderQuizInteractive(q) {
  const inter   = document.getElementById('quizInteractive');
  const hintArea = document.getElementById('quizHintArea');
  const ansBox  = document.getElementById('quizAnswerBox');
  const nextBox = document.getElementById('quizNext');

  // ── MCQ ──
  if (q.type === 'mcq') {
    inter.innerHTML = `<div class="mcq-options">${
      q.options.map((opt, i) => {
        let cls = 'mcq-btn';
        if (quizState.answered) {
          if (opt === q.answer)              cls += ' correct';
          else if (opt === quizState.chosen) cls += ' incorrect';
        } else if (opt === quizState.chosen) cls += ' selected';
        const mark = quizState.answered ? (opt === q.answer ? ' ✓' : opt === quizState.chosen ? ' ✗' : '') : '';
        return `<button class="${cls}" data-opt="${i}" ${quizState.answered ? 'disabled' : ''}>
          <span style="color:#a78bfa;margin-right:10px">${String.fromCharCode(65+i)}.</span>${opt}${mark}
        </button>`;
      }).join('')
    }</div>`;

    if (!quizState.answered) {
      inter.querySelectorAll('.mcq-btn').forEach((btn, i) => {
        btn.addEventListener('click', () => handleAnswer(q.options[i], q));
      });
    }
    renderMath(inter);

  // ── TRUE / FALSE ──
  } else if (q.type === 'tf') {
    inter.innerHTML = `<div class="tf-options">${
      ['True','False'].map(opt => {
        let cls = 'tf-btn';
        if (quizState.answered) {
          if (opt === q.answer)              cls += ' correct';
          else if (opt === quizState.chosen) cls += ' incorrect';
        }
        return `<button class="${cls}" data-opt="${opt}" ${quizState.answered ? 'disabled' : ''}>${opt}</button>`;
      }).join('')
    }</div>`;

    if (!quizState.answered) {
      inter.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', () => handleAnswer(btn.dataset.opt, q));
      });
    }

  // ── OTHER (complete / essay / match) ──
  } else {
    if (!quizState.answered) {
      inter.innerHTML = `<button class="btn-primary btn-reveal-quiz" id="btnRevealQuiz">Reveal Answer</button>`;
      document.getElementById('btnRevealQuiz').addEventListener('click', () => {
        quizState.answered = true;
        renderQuizInteractive(q);
      });
    }
  }

  // ── ANSWER BOX (after answering non-MCQ/TF types) ──
  if (quizState.answered && ['complete','essay','match'].includes(q.type)) {
    ansBox.innerHTML = `<div class="quiz-answer-box">✅ ${q.answer}</div>`;
    renderMath(ansBox);
  }

  // ② HINT BUTTON in quiz (show only before answering)
  if (q.hint && !quizState.answered) {
    hintArea.innerHTML = `
      <button class="quiz-hint-btn" id="quizHintBtn">
        💡 ${quizState.hintShownInQuiz ? 'Hide Hint' : 'Need a Hint?'}
      </button>
      ${quizState.hintShownInQuiz ? `<div class="quiz-hint-box">${q.hint}</div>` : ''}
    `;
    document.getElementById('quizHintBtn').addEventListener('click', () => {
      quizState.hintShownInQuiz = !quizState.hintShownInQuiz;
      renderQuizInteractive(q);
    });
    renderMath(hintArea);
  } else {
    hintArea.innerHTML = '';
  }

  // ── NEXT / FINISH BUTTON ──
  if (quizState.answered) {
    const isLast = quizState.idx + 1 >= quizState.questions.length;
    nextBox.innerHTML = `<button class="btn-primary btn-next" id="btnNext">${isLast ? 'Finish Quiz 🎓' : 'Next Question →'}</button>`;
    document.getElementById('btnNext').addEventListener('click', () => {
      if (isLast) {
        quizState.finished = true;
        renderQuiz();
      } else {
        quizState.idx++;
        quizState.answered = false;
        quizState.chosen   = null;
        quizState.hintShownInQuiz = false;
        renderQuiz();
      }
    });
  }
}

/* ══════════════════════════════════════════════════════════════════════════════
   QUIZ — Handle Answer Selection
   ══════════════════════════════════════════════════════════════════════════════ */
function handleAnswer(opt, q) {
  if (quizState.answered) return;
  quizState.chosen   = opt;
  quizState.answered = true;
  if (opt === q.answer) quizState.score++;
  renderQuizInteractive(q);
}

/* ══════════════════════════════════════════════════════════════════════════════
   BOOT — Initialize everything
   ══════════════════════════════════════════════════════════════════════════════ */
initHeader();
initSelects();
renderGrid();
renderStatsRow(); // ③ Load saved stats on startup
</script>
